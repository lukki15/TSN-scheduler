name: Editor CI

on:
  push:
    branches: ["**"]
    paths:
      - "editor/**"
      - "network-scheduler/**"
      - ".github/workflows/editor-ci.yml"
  pull_request:
    paths:
      - "editor/**"
      - "network-scheduler/**"
      - ".github/workflows/editor-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: editor

jobs:
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          working-directory: network-scheduler
          rust-target: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build scheduler-wasm package
        working-directory: network-scheduler/crates/scheduler-wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
