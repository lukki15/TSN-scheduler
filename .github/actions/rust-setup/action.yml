name: Rust setup

description: "Shared Rust setup for checkout, caching, and rustup install."

authors:
  - GitHub Actions

inputs:
  working-directory:
    description: 'Working directory for cargo commands'
    required: true
    default: '.'
  components:
    description: 'Optional rustup components to install'
    required: false
    default: ''
  rust-target:
    description: 'Optional Rust target triple to install'
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Install Rust
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustc --version
        cargo --version
      shell: bash

    - name: Install optional components
      if: ${{ inputs.components != '' }}
      run: |
        rustup component add ${{ inputs.components }}
      shell: bash

    - name: Install optional target
      if: ${{ inputs.rust-target != '' }}
      run: |
        rustup target add ${{ inputs.rust-target }}
      shell: bash
